<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGV Simulator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚚</text></svg>">
<style>
:root{--bg:#f4f5f7;--panel:#fff;--line:#dde1e6;--text:#1d2329;--muted:#6b7682;--blue:#1f6feb;--green:#2b8a3e;
      --red:#e03131;--amber:#e8890c;--purple:#7048e8;--hdr:#15202b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg)}
header{height:52px;background:var(--hdr);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px}
header h1{font-size:16px;margin:0;font-weight:600;white-space:nowrap}
header .grow{flex:1}
header .loadsw{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;cursor:pointer;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:5px 10px}
header .loadsw input{width:auto;margin:0;cursor:pointer}
#status{font-size:13px;color:#b8c4cf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 11px;cursor:pointer;color:var(--text)}
button:hover{border-color:#aab3bd}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.run{background:#2f9e44;border-color:#2f9e44;color:#fff;font-weight:600;padding:8px 18px;font-size:15px}
button.run:disabled{opacity:.6;cursor:wait}
button.danger{color:var(--red)}
button.small{padding:3px 8px;font-size:12px}
button.help{background:transparent;color:#fff;border-color:#4a5866}
button:disabled{opacity:.45;cursor:default}
#player select{width:auto}
#app{display:flex;height:calc(100% - 52px)}
#side{width:410px;min-width:340px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
#tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#tabs button{flex:1 1 24%;min-width:0;overflow:hidden;text-overflow:ellipsis;border:0;border-radius:0;padding:8px 2px;font-size:13px;white-space:nowrap;background:#f8f9fa;color:var(--muted);font-weight:600;border-bottom:3px solid transparent}
#tabs button.on{background:#fff;color:var(--text);border-bottom-color:var(--blue)}
#tabs .num{display:inline-block;width:20px;height:20px;border-radius:10px;background:#ced4da;color:#fff;font-size:12px;line-height:20px;margin-right:3px}
#tabs button.on .num{background:var(--blue)}
.pane{flex:1;overflow:auto;padding:14px 16px 40px;display:none}
.pane.on{display:block}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 8px}
h3:first-child{margin-top:4px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row label{flex:1;color:#39424b}
.row .unit{width:44px;color:var(--muted);font-size:12px}
input[type=number],input[type=text],select{font:inherit;padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:#fff;width:120px}
input[type=text].wide,select.wide{width:100%}
input:focus,select:focus{outline:2px solid #a5c8ff;border-color:var(--blue)}
.hint{color:var(--muted);font-size:12.5px;margin:4px 0 10px}
.box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;background:#fcfcfd}
.box.sel{border-color:#ffd43b;background:#fffdf2}
.warn{background:#fff4e6;border:1px solid #ffd8a8;color:#8a4b00;border-radius:6px;padding:7px 10px;margin:6px 0;font-size:13px}
.bad{background:#fff5f5;border-color:#ffc9c9;color:#a61e1e}
.good{background:#ebfbee;border:1px solid #b2f2bb;color:#1e6b2e;border-radius:6px;padding:7px 10px;margin:6px 0;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:4px 5px;border-bottom:1px solid #eef0f2;text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:600}
td:first-child,th:first-child{text-align:left}
tr.click{cursor:pointer}
tr.click:hover{background:#f1f5ff}
tr.selrow{background:#fff3bf}
td input{width:64px!important;padding:3px 4px!important}
details{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:#fff}
details>summary{padding:9px 12px;cursor:pointer;font-weight:600;list-style:none}
details>summary::before{content:"▸ ";color:var(--muted)}
details[open]>summary::before{content:"▾ "}
details>.inner{padding:0 12px 10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:4px;vertical-align:-1px}
#main{flex:1;position:relative;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
#banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(21,32,43,.88);color:#fff;padding:8px 14px;border-radius:8px;font-size:13.5px;pointer-events:none;max-width:80%;text-align:center}
#zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
#zoom button{width:34px;height:34px;padding:0;font-size:17px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
#player{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:none;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
#player input[type=range]{flex:1}
#tuneBox{position:fixed;inset:0;background:rgba(20,24,30,.45);display:flex;align-items:center;justify-content:center;z-index:50}
#tuneBox .card2{background:#fff;border-radius:12px;max-width:760px;width:calc(100% - 32px);max-height:88vh;overflow:auto;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#tuneBox pre{background:#f6f8fa;border:1px solid var(--line);border-radius:6px;padding:8px;font-size:12px;white-space:pre-wrap;max-height:180px;overflow:auto}
#tuneBox table td,#tuneBox table th{padding:4px 8px}
#tuneBox .pbar{height:8px;background:#e9ecef;border-radius:4px;overflow:hidden;margin:8px 0}#tuneBox .pbar div{height:100%;background:#2f9e44}
.seqtab td,.seqtab th{padding:3px 3px}.seqtab select{font-size:12px}
#recBtn.on{background:#e03131;border-color:#e03131;color:#fff}
#player .lbl{font-variant-numeric:tabular-nums;font-size:13px;min-width:250px}
#legend{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;line-height:1.7}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.card .k{color:var(--muted);font-size:12px}
.card .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.card .s{color:var(--muted);font-size:12px}
.card.ok{border-left:4px solid #40c057}.card.amber{border-left:4px solid #fab005}.card.red{border-left:4px solid #fa5252}
td.amber{background:#fff4d6}
.bar{display:flex;height:18px;border-radius:4px;overflow:hidden;margin:6px 0 2px}
.bar div{color:#fff;font-size:11px;line-height:18px;text-align:center;overflow:hidden;white-space:nowrap}
pre{font-size:11.5px;background:#f8f9fa;padding:10px;border-radius:6px;overflow:auto}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
#modal .m{background:#fff;border-radius:10px;max-width:94vw;max-height:92vh;overflow:auto;padding:16px 20px;position:relative}
#modal .x{position:absolute;right:10px;top:8px}
#modal img{max-width:100%}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#212529;color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:60;max-width:70vw}
#toast.err{background:#c92a2a}
.dirty::after{content:" ●";color:var(--amber)}
.flex{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
kbd{background:#eef0f2;border:1px solid #d5d9de;border-radius:4px;padding:0 4px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>🚚 AGV Simulator</h1>
  <span id="status">Loading…</span>
  <span class="grow"></span>
  <label id="loadSw" class="loadsw" title="On: the trolley weight slows speeding up and braking (grip / motor limit), longer stop past the tag. Off: same speed with or without trolleys.">
    <input type="checkbox" id="loadChk" onchange="setLoadEffects(this.checked)"> Trolley load calc</label>
  <button class="help" onclick="showHelp()">? Help</button>
  <button class="run" id="runBtn" onclick="runSim()">▶ Run simulation</button>
</header>

<div id="app">
  <div id="side">
    <div id="tabs">
      <button data-tab="route" class="on"><span class="num">1</span>Route</button>
      <button data-tab="vehicle"><span class="num">2</span>Vehicle</button>
      <button data-tab="results"><span class="num">3</span>Results</button>
      <button data-tab="turning"><span class="num">4</span>Turning</button>
      <button data-tab="sequence"><span class="num">5</span>Sequence</button>
      <button data-tab="combined" title="Several saved routes on one map"><span class="num">6</span>Combined</button>
      <button data-tab="rfid" title="Mark where the RFID tags go (marking plan)"><span class="num">7</span>RFID marks</button>
    </div>
    <div class="pane on" id="pane-route"></div>
    <div class="pane" id="pane-vehicle"></div>
    <div class="pane" id="pane-results"></div>
    <div class="pane" id="pane-turning"></div>
    <div class="pane" id="pane-sequence"></div>
    <div class="pane" id="pane-combined"></div>
    <div class="pane" id="pane-rfid"></div>
  </div>
  <div id="main">
    <canvas id="cv"></canvas>
    <div id="banner" style="display:none"></div>
    <div id="legend" style="display:none"></div>
    <div id="zoom">
      <button title="Zoom in" onclick="zoomBy(1.3)">+</button>
      <button title="Zoom out" onclick="zoomBy(1/1.3)">−</button>
      <button title="Fit floor plan" onclick="fitView();draw()">⤢</button>
      <button title="Ruler: click points to measure (Esc = stop)" id="rulerBtn" onclick="toggleRuler()">📐</button>
    </div>
    <div id="player">
      <button id="playBtn" onclick="togglePlay()">▶</button>
      <input type="range" id="scrub" min="0" max="1" step="0.05" value="0">
      <span class="lbl" id="plLbl"></span>
      <select id="plSpeed" title="Playback speed">
        <option value="1">1×</option><option value="2">2×</option><option value="5" selected>5×</option>
        <option value="10">10×</option><option value="20">20×</option></select>
      <label class="muted"><input type="checkbox" id="plSwept" checked> swept area</label>
      <label class="muted"><input type="checkbox" id="plFollow"> follow</label>
      <button id="recBtn" onclick="toggleRecord()" title="Record the whole cycle as a video file (what you see on the map, at the playback speed chosen here). Zoom / pan first to frame it.">⏺ Save video</button>
    </div>
  </div>
</div>

<div id="modal" onclick="if(event.target===this)closeModal()"><div class="m"><button class="x" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div>
<div id="toast"></div>

<script>
"use strict";
// =====================================================================================
// state
// =====================================================================================
const S = {
  files: {agvs: [], routes: [], maps: []},
  agvName: null, agv: null, agvDirty: false,
  routeName: null, route: null, routeDirty: false,
  img: null, imgW: 0, imgH: 0, obst: null, showObst: false,
  view: {s: 1, ox: 0, oy: 0},
  sel: -1, down: null, mode: "edit", calib: [], ruler: {pts: [], mouse: null}, blockDraft: null,
  auto: {mode: "plan", style: "orthogonal", margin: "", max_radius: 2.5, min_radius: 0.75, tape_limit: 70, fast: null, busy: false, result: null, tsafe: true, push: ""},
  preview: null, previewSeq: 0, undo: [],
  res: null, stale: false, swept: null, play: {t: 0, on: false, last: 0},
  tab: "route", turn: null, turnImg: null, turnOpts: {angle: 90, radii: "0.5 0.75 1 1.25 1.5 2 2.5 3", cart: true, show: ""},
};
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmt = (v, d = 1) => (v === null || v === undefined || !isFinite(v)) ? "–" : Number(v).toFixed(d);
const mpp = () => (S.tab === "combined" && S.comb && S.comb.data && S.comb.data.map.meters_per_pixel) ||
                  (S.tab === "rfid" && S.rf && S.rf.data && S.rf.data.map.meters_per_pixel) ||
                  (S.route && S.route.map.meters_per_pixel) || 0.02;

// =====================================================================================
// server
// =====================================================================================
async function api(url, opts = {}) {
  let r, j;
  try { r = await fetch(url, opts); } catch (e) { throw new Error("Cannot reach the simulator. Is the terminal window still open?"); }
  try { j = await r.json(); } catch (e) { throw new Error("Server error (" + r.status + ")"); }
  if (!r.ok || j.error) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}
const post = (url, data) => api(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(data)});

let toastT = 0;
function toast(msg, err = false) {
  const t = $("toast"); t.textContent = msg; t.className = err ? "err" : ""; t.style.display = "block";
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = "none", err ? 6000 : 2500);
}
function status(msg) { $("status").textContent = msg; }

// =====================================================================================
// start-up
// =====================================================================================
async function init() {
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
  S.files = await api("/api/files");
  const a = S.files.agvs.includes("agv2.yaml") ? "agv2.yaml" : S.files.agvs[0];
  if (a) await loadAgv(a); else { S.agv = null; }
  const r = ["agv2_tape_loop.yaml", "demo_route.yaml"].find(f => S.files.routes.includes(f)) || S.files.routes[0];
  if (r) await loadRoute(r); else newRoute("my_route");
  renderAll();
}

function setTab(t) {
  if (S.seqPlay && t !== "sequence") stopSeqPlay();
  const was = S.tab;
  if (t !== "route" && S.mode === "branch") { S.mode = "edit"; S.branch = null; banner(); }
  if ((t === "combined" || t === "rfid") && S.play.on) togglePlay(false);
  if ((t === "combined" || t === "rfid") && S.rec) stopRecord(false);
  S.tab = t;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + t));
  const veh = t === "vehicle" || t === "turning";
  if (veh && S.play.on) togglePlay(false);
  if (veh && S.rec) stopRecord(false);
  if (t === "turning") renderTurning();
  if (t === "sequence") renderSequencePane();
  $("zoom").style.display = veh ? "none" : "flex";
  $("player").style.display = (!veh && t !== "combined" && t !== "rfid" && S.res && !S.stale) ? "flex" : "none";
  if (t === "combined" && was !== "combined") { banner(); combEnter(); }
  if (t === "rfid" && was !== "rfid") { banner(); renderRfidPane(); rfEnter(); }
  if (was === "rfid" && t !== "rfid") { if (S.rf) { S.rf.armed = null; S.rf.drag = null; } if (t !== "combined") combLeave(); }
  if (was === "combined" && t !== "combined" && t !== "rfid") combLeave();
  if (veh) { $("legend").style.display = "none"; banner(); }
  draw();
}

function renderAll() { renderRoutePane(); renderVehiclePane(); renderResults(); renderTurning(); renderSequencePane(); renderCombinedPane(); renderRfidPane(); updateStatus(); draw(); }

// =====================================================================================
// sequence: several routes (each with its own vehicle) one after another
// =====================================================================================
function seqNew() {
  S.seq = {file: "", dirty: false, busy: false, result: null,
           data: {name: "sequence", target_s: 0, steps: []}};
}
function seqStepDefault() {
  return {route: S.routeName && S.files.routes.includes(S.routeName) ? S.routeName : (S.files.routes[0] || ""),
          agv: S.agvName || (S.files.agvs[0] || ""), repeat: 1, wait_after: 0, note: ""};
}
function renderSequencePane() {
  const el = $("pane-sequence"); if (!el) return;
  if (!S.seq) seqNew();
  const Q = S.seq, D = Q.data, files = S.files.sequences || [];
  const opt = (list, cur) => (list.includes(cur) || !cur ? "" : `<option selected>${esc(cur)} (missing)</option>`) +
                             list.map(f => `<option ${f === cur ? "selected" : ""}>${esc(f)}</option>`).join("");
  let h = `<h3>Sequence file</h3>
    <div class="flex"><select class="wide" onchange="seqOpen(this.value)"><option value="">${Q.file ? "" : "(new, not saved)"}</option>${files.map(f => `<option ${f === Q.file ? "selected" : ""}>${esc(f)}</option>`).join("")}</select>
      <button class="small" onclick="seqNew();renderSequencePane()">New</button></div>
    <div class="flex" style="margin-top:6px"><button class="primary ${Q.dirty ? "dirty" : ""}" onclick="seqSave()">Save sequence</button><button onclick="seqSave(true)">Save as…</button></div>
    <div class="hint">One AGV drives the steps one after another; every step uses its own route and its own vehicle (trolleys, speeds, PID).</div>
    <div class="row"><label>Name</label><input type="text" value="${esc(D.name)}" onchange="S.seq.data.name=this.value;seqDirty()"></div>
    <div class="row"><label>Target for the whole sequence</label><input type="number" min="0" step="10" placeholder="none" value="${D.target_s || ""}" onchange="S.seq.data.target_s=Math.max(0,+this.value||0);seqDirty(false)"><span class="unit">s</span></div>
    <h3>Steps (${D.steps.length})</h3>`;
  if (!D.steps.length) h += `<div class="hint">Press <b>+ Add step</b>, then pick the route and the vehicle for it.</div>`;
  else {
    h += `<table class="seqtab"><tr><th>#</th><th>Route</th><th>Vehicle</th><th title="Drive this route this many times in a row">×</th><th title="Pause after this step (s)">Wait</th><th></th></tr>`;
    D.steps.forEach((st, i) => {
      h += `<tr><td>${i + 1}</td>
        <td><select style="max-width:130px" onchange="seqSet(${i},'route',this.value)">${opt(S.files.routes, st.route)}</select></td>
        <td><select style="max-width:110px" onchange="seqSet(${i},'agv',this.value)">${opt(S.files.agvs, st.agv)}</select></td>
        <td><input type="number" min="1" step="1" style="width:44px" value="${st.repeat || 1}" onchange="seqSet(${i},'repeat',Math.max(1,Math.round(+this.value||1)))"></td>
        <td><input type="number" min="0" step="5" style="width:52px" value="${st.wait_after || 0}" onchange="seqSet(${i},'wait_after',Math.max(0,+this.value||0))"></td>
        <td style="white-space:nowrap"><button class="small" title="Up" onclick="seqMove(${i},-1)" ${i ? "" : "disabled"}>↑</button><button class="small" title="Down" onclick="seqMove(${i},1)" ${i < D.steps.length - 1 ? "" : "disabled"}>↓</button><button class="small danger" title="Remove" onclick="seqDel(${i})">✕</button></td></tr>`;
    });
    h += `</table>`;
  }
  h += `<div class="flex" style="margin-top:6px"><button class="small" onclick="seqAdd()">+ Add step</button>
        ${D.steps.length ? `<button class="small" onclick="seqAdd(true)" title="Copy the last step">+ Copy last</button>` : ""}</div>
    <button class="primary" style="margin-top:10px" id="seqRunBtn" onclick="seqRun()" ${Q.busy || !D.steps.length ? "disabled" : ""}>${Q.busy ? "Simulating the steps…" : "▶ Run sequence"}</button>`;
  const R = Q.result;
  if (R) {
    const tg = R.target_s, gap = R.gap_s, ok = R.steps.filter(s => !s.error);
    h += `<div class="cards" style="margin-top:10px">` +
      card("Sequence time", `${fmt(R.total_s, 1)} s`, tg ? `target ${fmt(tg, 0)} s · ${gap > 0.05 ? fmt(gap, 1) + " s too slow" : fmt(-gap, 1) + " s to spare"}` : `${fmt(R.total_s / 60, 1)} min`, tg ? (gap > 0.05 ? "red" : "ok") : "") +
      card("Per hour", `${fmt(3600 / Math.max(R.total_s, 1e-6), 2)}`, "sequences per hour") +
      card("Distance", `${fmt(ok.reduce((a, s) => a + (s.distance_m || 0), 0), 0)} m`, `${ok.length} of ${R.steps.length} steps ran`) +
      card("Energy", `${fmt(ok.reduce((a, s) => a + (s.energy_wh || 0), 0), 1)} Wh`, "whole sequence") + `</div>`;
    h += `<table style="margin-top:8px"><tr><th>#</th><th>Route · vehicle</th><th>×</th><th>Cycle</th><th>From → to</th><th>Avg</th><th>Tape</th><th></th></tr>` +
      R.steps.map(st => st.error ? `<tr><td>${st.i + 1}</td><td colspan="7" style="text-align:left;color:#c92a2a">${esc(st.route)} · ${esc(st.agv)}: ${esc(st.error)}</td></tr>` :
        `<tr class="click" onclick="startSeqPlay(${st.i})" title="Play from this step"><td>${st.i + 1}</td>
         <td style="text-align:left;white-space:normal">${esc(st.route.replace(/\.ya?ml$/, ""))}<br><span class="muted">${esc(st.agv.replace(/\.ya?ml$/, ""))}</span></td>
         <td>${st.repeat}</td><td>${fmt(st.cycle_s, 1)} s${st.route_target_s ? `<br><span class="muted" style="color:${st.cycle_s > st.route_target_s + 0.05 ? "#c92a2a" : "#2b8a3e"}">target ${fmt(st.route_target_s, 0)}</span>` : ""}</td>

async function startTune() {
  if (!S.route || S.route.waypoints.length < 2) { toast("Open or draw a route first (Route tab) - the PID is tuned on it.", true); return; }
  if (!S.agv.line_follow.enabled) { toast("Tick 'Simulate the real tape-following PID' first.", true); return; }
  try {
    const j = await post("/api/tune_pid", {agv: S.agv, route: S.route, options: {rounds: 8}});
    S.tune = {job: j.job, st: null}; showTune(); pollTune();
  } catch (e) { toast(e.message, true); }
}
async function pollTune() {
  if (!S.tune) return;
  try { S.tune.st = await api("/api/tune_pid/" + S.tune.job); } catch (e) { S.tune.st = {done: true, error: e.message, log: []}; }
  showTune();
  if (!S.tune.st.done) setTimeout(pollTune, 1500);
}
function stopTune() { if (S.tune) post(`/api/tune_pid/${S.tune.job}/stop`, {}).catch(() => {}); }

async function loadRoute(name) {
  const j = await api("/api/route/" + encodeURIComponent(name));
  S.route = j.data; S.routeName = j.name; S.routeDirty = false; S.sel = -1; S.multi = []; S.undo = [];
  S.files.maps = j.maps; clearResult();

function newRoute(name) {
  const map = (S.route && S.route.map.image) || S.files.maps[0] || "";
  S.route = {name: name, map: {image: map, meters_per_pixel: (S.route ? mpp() : 0.02), obstacle_threshold: 100},
             loop: true, default_radius: 1.5, default_mode: "", waypoints: [], blocked: []};
  S.routeName = name.replace(/[^A-Za-z0-9_\-]+/g, "_") + ".yaml";
  S.routeDirty = true; S.sel = -1; S.multi = []; S.undo = []; S.preview = null; clearResult();
  if (map && (!S.img || S.img.dataset.name !== map)) loadMap(map);

function loadMap(name) {
  return new Promise(resolve => {
    if (!name) { S.img = null; resolve(); return; }
    const im = new Image();
    im.onload = () => { S.img = im; im.dataset.name = name; S.imgW = im.naturalWidth; S.imgH = im.naturalHeight;
                        buildObstacles(); fitView(); renderRoutePane(); draw(); resolve(); };
    im.onerror = () => { toast("Could not load floor plan " + name, true); resolve(); };
    im.src = "/maps/" + encodeURIComponent(name) + "?v=" + Date.now();
  });
}

function buildObstacles() {
  if (!S.img || !S.showObst) { S.obst = null; return; }
  const c = document.createElement("canvas"); c.width = S.imgW; c.height = S.imgH;
  const g = c.getContext("2d"); g.drawImage(S.img, 0, 0);
  const d = g.getImageData(0, 0, S.imgW, S.imgH), p = d.data, th = S.route.map.obstacle_threshold;
  for (let i = 0; i < p.length; i += 4) {
    const a = p[i + 3] / 255;   // transparent pixels count as white (like the simulator)
    const gray = (0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]) * a + 255 * (1 - a);
    if (gray < th) { p[i] = 230; p[i + 1] = 30; p[i + 2] = 30; p[i + 3] = 150; } else p[i + 3] = 0;
  }
  g.putImageData(d, 0, 0); S.obst = c;
}

function branchSnap(sx, sy) {          // nearest point on the route's straight legs (screen px)

function drawBranchDraft() {

function delBlock(i) { pushUndo(); S.route.blocked.splice(i, 1); routeChanged(); }
function snapPoint(sx, sy, alt) {

    (S.route ? S.route.waypoints : []).forEach(w => { const [x, y] = w2s(w.x, w.y), d = Math.hypot(x - sx, y - sy); if (d < bd) { bd = d; best = {x: w.x, y: w.y}; } });

  for (let r = 0; r < S.preview.runs.length; r++) {
    const R = S.preview.runs[r];
    if (r === p.run) { for (let i = 1; i <= p.i; i++) s0 += Math.hypot(R.x[i] - R.x[i - 1], R.y[i] - R.y[i - 1]); return s0; }

function toggleFast(m, on) { const f = S.auto.fast; if (on && !f.includes(m)) f.push(m); if (!on) S.auto.fast = f.filter(x => x !== m); }

function wpColor(w) { return w.action === "stop" || (w.cart && w.action === "pass") ? "#e03131" : w.action === "pivot" ? "#7048e8" : "#1f6feb"; }
function select(i) { S.sel = (i >= 0 && S.route && i < S.route.waypoints.length) ? i : -1; S.multi = []; renderRoutePane(); draw(); }

function selSet() { const m = (S.multi || []).filter(i => S.route && i < S.route.waypoints.length); return m.length ? m : (S.sel >= 0 ? [S.sel] : []); }

function selectMany(list) {

function selectAll() { if (S.route) selectMany(S.route.waypoints.map((_, i) => i)); }

function wpLoad(v) {

function cartTag(w) {

async function switchRoute(name) {

// ---------------------------------------------------------------- live path preview
let prevTimer = 0;
function schedulePreview() { clearTimeout(prevTimer); prevTimer = setTimeout(doPreview, 250); }
async function doPreview() {

    const j = await post("/api/preview", {agv: S.agv, route: S.route});
    if (seq !== S.previewSeq) return;
    S.preview = j;
  } catch (e) { if (seq === S.previewSeq) S.preview = {runs: [], warnings: [e.message]}; }
  renderRoutePane(); draw();
}

// ---------------------------------------------------------------- scale calibration
function startCalib() {
  if (!S.img) { toast("Load a floor plan first", true); return; }
  S.mode = "calib"; S.calib = []; banner("📏 Click the FIRST end of a distance you know (e.g. column to column).");
}
function calibClick(sx, sy) {
  const px = (sx - S.view.ox) / S.view.s, py = (sy - S.view.oy) / S.view.s;
  S.calib.push([px, py]); draw();
  if (S.calib.length === 1) { banner("📏 Now click the SECOND end."); return; }
  const [a, b] = S.calib, dpx = Math.hypot(b[0] - a[0], b[1] - a[1]);
  setTimeout(() => {
    const d = parseFloat((prompt("Real distance between the two points, in metres:", "") || "").replace(",", "."));
    S.mode = "edit"; S.calib = []; banner();
    if (d > 0 && dpx > 0) { setScale(+(d / dpx).toPrecision(5)); toast(`Scale set: 1 px = ${fmt(d / dpx * 1000, 2)} mm`); }
    draw();
  }, 30);
}
function banner(msg) { const b = $("banner"); b.style.display = msg ? "block" : "none"; if (msg) b.textContent = msg; }

// =====================================================================================
// combined: several saved routes on one map (only viewing - nothing is changed)
// =====================================================================================
const COMB_COLORS = ["#1f77b4", "#d62728", "#2ca02c", "#9467bd", "#ff7f0e", "#17becf", "#8c564b", "#e377c2", "#bcbd22", "#7f7f7f"];
function combState() {
  if (S.comb) return S.comb;
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("agv_comb") || "{}") || {}; } catch (e) { saved = {}; }
  S.comb = {sel: saved.sel || null, colors: saved.colors !== false, spread: saved.spread !== false, arrows: saved.arrows !== false,
            stops: !!saved.stops, plan: saved.plan !== false, merge: saved.merge || 2.5, data: null, busy: false, hl: -1, err: ""};
  return S.comb;
}
function combSave() {
  const C = S.comb;
  try { localStorage.setItem("agv_comb", JSON.stringify({sel: C.sel, colors: C.colors, spread: C.spread, arrows: C.arrows,
                                                          stops: C.stops, plan: C.plan, merge: C.merge})); } catch (e) { /* private window */ }
}
function combDefaultSel() {
  const auto = S.files.routes.filter(f => /_auto\.ya?ml$/i.test(f));
  return auto.length ? auto : S.files.routes.slice();
}
function combChosen() {

}
async function combEnter() {

}
async function combMap() {

  if (S.routeReload && S.routeReload === S.routeName && !S.routeDirty) { S.routeReload = null; loadRoute(S.routeName).then(renderAll); return; }
  // back to the route being edited: its own floor plan and view

async function combLoad(fit = false) {
  const C = combState(), names = combChosen();

  C.busy = true; renderCombinedPane();
  try {
    C.data = await post("/api/combined", {routes: names, merge: C.merge, agv: S.agv});
    if (C.tags) for (const R of C.data.routes) { const o = C.tags.ops[R.file];
      if (o && o.sig !== R.sig) { delete C.tags.ops[R.file]; toast(`${R.label} was changed meanwhile - its unsaved tag changes were dropped.`, true); } }

function combFit() {

  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;

  const [cx, cy] = [(x0 + x1) / 2, (y0 + y1) / 2];

// ---------------------------------------------------------------- combined: follow a route inside an area
function combFollow() {
  const C = combState();
  if (!C.follow) C.follow = {ref: "", targets: null, area: null, keep: true, check: true, busy: false, result: null, err: ""};
  const F = C.follow, files = (C.data ? C.data.routes : []).map(R => R.file);
  if (!files.includes(F.ref)) F.ref = files.find(f => /ITG/i.test(f)) || files[0] || "";
  if (!F.targets) F.targets = files.filter(f => f !== F.ref);
  F.targets = F.targets.filter(f => files.includes(f) && f !== F.ref);

function getP(o, p) { return p.split(".").reduce((a, k) => a == null ? a : a[k], o); }

// With line following on, HIGH / SLOW / APPROACH run at the line_follow values (like modes.py on the real
// AGV). The Speed modes table rows of those names are kept equal to them: editing either one changes both.
const LF_MODE = {HIGH: ["speed_high", "accel_rate", "decel_rate"], SLOW: ["speed_slow", "accel_rate", "decel_rate"],
                 APPROACH: ["speed_approach", "accel_rate", "approach_decel_rate"]};
function lfLink(A, name) {
  return A && A.line_follow && A.line_follow.enabled ? LF_MODE[String(name || "").trim().toUpperCase()] : null;

function syncModesFromLF(A) {

    const L = lfLink(A, m.name); if (!L) return;
    const lf = A.line_follow;
    m.v_straight = lf[L[0]]; m.v_curve = lf[L[0]]; m.accel = lf[L[1]]; m.decel = lf[L[2]]; m.v_reverse = lf.speed_reverse;

}

function derivedInfo() {
  const A = S.agv, d = A.drivetrain;
  const vmax = d.motor_max_rpm / d.gear_ratio * Math.PI * A.wheels.diameter / 60;
  const tq = d.motor_rated_power_w / (d.motor_rated_rpm * 2 * Math.PI / 60);
  const F = 2 * tq * d.gear_ratio * d.gear_efficiency / (A.wheels.diameter / 2);
  return `<div class="box"><b>Calculated from these values</b>
    <div>Top speed the motors allow: <b>${fmt(vmax, 2)} m/s</b>${A.performance.v_straight > vmax ? ' <span style="color:#e03131">(set speed is higher!)</span>' : ""}</div>
    <div>Rated motor torque: ${fmt(tq, 3)} N·m, peak ${fmt(tq * d.motor_peak_torque_factor, 2)} N·m</div>
    <div>Continuous pulling force (both wheels): ${fmt(F, 0)} N</div></div>`;
}

function trolleyMasses() {
  const c = S.agv.cart, n = Math.max(1, c.count || 1), ms = (c.masses || []).slice(0, n);
  while (ms.length < n) ms.push(c.mass_kg);
  return ms;
}
function setTrolleyCount(n) {
  n = Math.max(1, Math.min(10, Math.round(n) || 1));
  const ms = trolleyMasses(); while (ms.length < n) ms.push(ms[ms.length - 1] ?? S.agv.cart.mass_kg);
  S.agv.cart.count = n; S.agv.cart.masses = ms.slice(0, n); agvChanged(true);
}
function setTrolleyMass(i, v) {
  v = parseFloat(String(v).replace(",", ".")); if (!isFinite(v) || v < 0) { toast("Please enter a weight in kg", true); renderVehiclePane(); return; }
  const ms = trolleyMasses(); ms[i] = v; S.agv.cart.masses = ms; agvChanged(true);
}
async function importProfile(input) {
  const f = input.files[0]; if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  try {
    const j = await api("/api/import_profile", {method: "POST", body: fd});
    Object.assign(S.agv.line_follow, j.line_follow); S.agv.line_follow.enabled = true;
    const ex = Object.entries(j.extras || {}).filter(([k, v]) => getP(S.agv, k) !== v).map(([k, v]) => `${k} = ${v} (vehicle has ${getP(S.agv, k)})`);
    syncModesFromLF(S.agv); agvChanged(true);
    toast(`Imported ${Object.keys(j.line_follow).length} PID/speed values${j.agv_id ? " from " + j.agv_id : ""}.` + (ex.length ? " Note: profile says " + ex.join("; ") : ""));
  } catch (e) { toast(e.message, true); }

}
function agvSet(p, v, raw = false) {
  const cur = getP(S.agv, p);
  if (!raw) { v = parseFloat(String(v).replace(",", ".")); if (!isFinite(v)) { toast("Please enter a number", true); renderVehiclePane(); return; } }
  setP(S.agv, p, v);
  if (p.startsWith("line_follow.")) { syncModesFromLF(S.agv); agvChanged(true); return; }
  agvChanged(p === "hook.type" || p === "name");

function tableSet(t, i, k, v, isText) {

  if (!isText) { v = parseFloat(String(v).replace(",", ".")); if (!isFinite(v)) { toast("Please enter a number", true); renderVehiclePane(); return; } }
  rows[i][k] = v;
  if (t === "speed_modes") {
    const L = lfLink(S.agv, rows[i].name), lf = S.agv.line_follow;
    if (L && k !== "name") {
      if (k === "v_straight" || k === "v_curve") lf[L[0]] = v;
      else if (k === "accel") lf[L[1]] = v;
      else if (k === "decel") lf[L[2]] = v;
      else if (k === "v_reverse") lf.speed_reverse = v;
      if (k === "accel" || k === "v_reverse") toast(`Line following: ${k === "accel" ? "ACCEL_RATE" : "REVERSE speed"} is shared by HIGH, SLOW and APPROACH - changed for all three.`);
    }
    syncModesFromLF(S.agv);
  }
  if (t === "sensors" && k === "name") {   // keep "path following" pointing at the renamed sensor
    for (const dir of ["forward", "reverse"]) if (S.agv.tracking[dir] === old) S.agv.tracking[dir] = v;
  }
  if (t === "speed_modes" && k === "name" && S.route) {   // keep route legs pointing at the renamed mode
    S.route.waypoints.forEach(w => { if (w.mode === old) w.mode = v; });
    if (S.route.default_mode === old) S.route.default_mode = v;

}
function tableAdd(si) { const sec = AGV_FORM[si]; getP(S.agv, sec.table).push(JSON.parse(JSON.stringify(sec.blank))); agvChanged(true); }
function tableDel(t, i) {
  const rows = getP(S.agv, t), gone = rows.splice(i, 1)[0];
  if (t === "sensors") for (const dir of ["forward", "reverse"]) if (S.agv.tracking[dir] === gone.name) S.agv.tracking[dir] = "axle";
  agvChanged(true);
}
function agvChanged(rerender = false) {

  if (rerender) renderVehiclePane(); else {
    const b = document.querySelector("#pane-vehicle button.primary"); if (b) b.classList.add("dirty");
    draw(); const box = document.querySelector("#pane-vehicle > .box"); if (box) box.outerHTML = derivedInfo();

}

function vehicleParts(A) {
  // polygons in the body frame (x forward, y left) - same as the simulator's drawing
  const P = [], R = (x0, x1, y0, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  const xr = -A.chassis.axle_from_rear, xf = A.chassis.length + xr, hw = A.chassis.width / 2;
  if (A.hook.type === "tow") {
    const c = A.cart, n = Math.max(1, c.count || 1);
    let hx = A.hook.x, hy = A.hook.y;
    for (let k = 0; k < n; k++) {
      const ax = hx - c.tongue_length;
      P.push({pts: R(ax - c.axle_from_rear, ax - c.axle_from_rear + c.length, -c.width / 2, c.width / 2), fill: "none", dash: true});
      P.push({line: [[hx, hy], [ax, 0]]});
      hx = ax - (c.coupling_behind_axle ?? 0.3); hy = 0;
    }
  }
  P.push({pts: R(xr, xf, -hw, hw), fill: "#9ecae1"});
  const r = A.wheels.diameter / 2, w = A.wheels.width, b = A.wheels.track, d = A.drivetrain;
  P.push({pts: R(-r, r, b / 2 - w / 2, b / 2 + w / 2), fill: "#252525"}, {pts: R(-r, r, -b / 2 - w / 2, -b / 2 + w / 2), fill: "#252525"});
  for (const c of A.wheels.castors || []) P.push({pts: R(c.x - c.diameter / 2, c.x + c.diameter / 2, c.y - c.width / 2, c.y + c.width / 2), fill: "#868e96"});
  for (const sg of [1, -1]) {
    const yin = sg * (b / 2 - w / 2), yg = yin - sg * d.gearbox_length, md = d.motor_diameter;
    P.push({pts: R(-md / 2, md / 2, Math.min(yin, yg), Math.max(yin, yg)), fill: "#fdae6b"});
    if (d.layout === "coaxial") { const ym = yg - sg * d.motor_length; P.push({pts: R(-md / 2, md / 2, Math.min(yg, ym), Math.max(yg, ym)), fill: "#e6550d"}); }
    else { const yc = (yin + yg) / 2; P.push({pts: R(md / 2, md / 2 + d.motor_length, yc - md / 2, yc + md / 2), fill: "#e6550d"}); }
  }
  if (A.hook.type === "lurking") { const c = A.cart; P.push({pts: R(A.hook.x - c.length / 2, A.hook.x + c.length / 2, A.hook.y - c.width / 2, A.hook.y + c.width / 2), fill: "none", dash: true}); }
  return P;
}

function drawVehicle(g, W, H) {

  parts.forEach(p => (p.pts || p.line).forEach(q => { xs.push(q[0]); ys.push(q[1]); }));
  (A.sensors || []).forEach(s => { xs.push(s.x); ys.push(s.y); });

  const pad = 110, k = Math.min((W - 2 * pad) / (x1 - x0 || 1), (H - 2 * pad - 40) / (y1 - y0 || 1), 900);
  const ox = (W - (x1 - x0) * k) / 2, oy = 40 + (H - 40 - (y1 - y0) * k) / 2;

    p.pts.forEach((q, i) => i ? g.lineTo(...T(...q)) : g.moveTo(...T(...q))); g.closePath();

    let [ax, ay] = T(...p0), [bx, by] = T(...p1); const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1, nx = -dy / L * off, ny = dx / L * off;
    g.strokeStyle = "#868e96"; g.lineWidth = 1; g.beginPath();
    g.moveTo(ax, ay); g.lineTo(ax + nx, ay + ny); g.moveTo(bx, by); g.lineTo(bx + nx, by + ny);
    g.moveTo(ax + nx, ay + ny); g.lineTo(bx + nx, by + ny); g.stroke();
    txt(label, (ax + bx) / 2 + nx * 1.35, (ay + by) / 2 + ny * 1.35, "#495057", "center");
  }
  const xr = -A.chassis.axle_from_rear, xf = A.chassis.length + xr, hw = A.chassis.width / 2;
  dim([xr, -hw], [xf, -hw], `length ${mm(A.chassis.length)}`, 30);
  dim([xf, -hw], [xf, hw], `width ${mm(A.chassis.width)}`, 40);
  dim([xr, hw], [0, hw], `rear → axle ${mm(A.chassis.axle_from_rear)}`, -24);

  // drive-axle origin
  const [o0, o1] = T(0, 0); g.strokeStyle = "#e03131"; g.lineWidth = 2;
  g.beginPath(); g.moveTo(o0 - 9, o1); g.lineTo(o0 + 9, o1); g.moveTo(o0, o1 - 9); g.lineTo(o0, o1 + 9); g.stroke();
  { const [bx, by] = T(0, -hw); txt("▲ drive axle = 0,0", bx, by + 14, "#c92a2a", "center"); }
  if (A.hook.type !== "none") {
    const [hx, hy] = T(A.hook.x, A.hook.y); g.strokeStyle = "#d9480f"; g.lineWidth = 3;
    g.beginPath(); g.moveTo(hx - 8, hy); g.lineTo(hx + 8, hy); g.moveTo(hx, hy - 8); g.lineTo(hx, hy + 8); g.stroke();
    txt(`${A.hook.type === "tow" ? "tow hitch" : "lift"} x=${fmt(A.hook.x, 3)}`, hx, hy - 16, "#d9480f", "center");
    if (A.hook.type === "tow") {
      const [cx, cy] = T(A.hook.x - A.cart.tongue_length, 0);
      const ms = trolleyMasses();
      txt(ms.length > 1 ? `${ms.length} trolleys: ${ms.map(m => fmt(m, 0)).join(" + ")} kg` : `cart (hitch → axle ${mm(A.cart.tongue_length)})`,
          cx, cy + (A.cart.width / 2) * k + 16, "#2b8a3e", "center");
    } else txt("cart outline", ...T(A.hook.x, A.hook.y - A.cart.width / 2), "#2b8a3e");
  }
  (A.sensors || []).forEach((s, i) => {
    const [sx, sy] = T(s.x, s.y), trk = s.name === A.tracking.forward || s.name === A.tracking.reverse;
    g.fillStyle = trk ? "#2b8a3e" : "#7048e8"; g.beginPath(); g.arc(sx, sy, 5, 0, 7); g.fill();
    txt(`${s.name}  x=${fmt(s.x, 3)}${s.y ? " y=" + fmt(s.y, 3) : ""}${trk ? "  (follows line)" : ""}`, sx, sy + (i % 2 ? 20 : -20), trk ? "#2b8a3e" : "#5f3dc4", "center");
  });
  g.font = "bold 15px sans-serif"; txt(`${A.name} - top view`, 16, 22);
  g.font = "13px sans-serif"; txt("forward →", W - 16, 22, "#495057", "right");
  txt(`drive wheels Ø ${mm(A.wheels.diameter)}, ${mm(A.wheels.track)} apart · ${A.chassis.mass_kg} kg` +
      (A.hook.type === "tow" ? ` · ${trolleyMasses().length} trolley(s) ${fmt(trolleyMasses().reduce((a, b) => a + b, 0), 0)} kg` :
       A.hook.type !== "none" ? ` · cart ${A.cart.mass_kg} kg` : ""), 16, 44, "#495057");
  txt("blue chassis · black drive wheels · grey castors · orange gearbox/motor · green dot = sensor that follows the line", 16, H - 16, "#6b7682");
}

// =====================================================================================
// simulation + results
// =====================================================================================
async function runSim() {
  if (S.seqPlay) stopSeqPlay();
  if (!S.route || !S.agv) return;
  if (S.route.waypoints.length < 2) { toast("Add at least two route points first (click on the map).", true); return; }
  const btn = $("runBtn"); btn.disabled = true; btn.textContent = "Simulating…";
  try {
    const j = await post("/api/run", {agv: S.agv, route: S.route, agv_name: S.agvName});
    S.res = j; S.stale = false; S.play = {t: 0, on: false, last: 0};
    S.swept = null;
    if (j.swept_png) { const im = new Image(); im.onload = () => { S.swept = im; draw(); }; im.src = "data:image/png;base64," + j.swept_png; }
    const T = j.traj.t; $("scrub").max = T[T.length - 1]; $("scrub").value = 0;
    $("player").style.display = "flex";
    renderResults(); setTab("results"); fitView(); draw(); togglePlay(true);
  } catch (e) { toast(e.message, true); }
  btn.disabled = false; btn.textContent = "▶ Run simulation";
}

function clearResult() { if (S.rec) stopRecord(false); S.res = null; S.stale = false; S.play.on = false; $("player").style.display = "none"; renderResults(); }
function staleResult() {
  if (!S.res || S.stale) return;
  S.stale = true; S.play.on = false; $("player").style.display = "none"; renderResults();
}

function card(k, v, s, level = "") { return `<div class="card ${level}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s || ""}</div></div>`; }
const lvl = (x, a, r) => x > r ? "red" : x > a ? "amber" : "ok";

function renderResults() {
  const el = $("pane-results");
  if (!S.res) { el.innerHTML = `<h3>Results</h3><p>Draw a route, check the vehicle, then press <b>▶ Run simulation</b> (top right).</p>`; return; }
  const s = S.res.summary, m = s.motor, e = s.energy, T = s.cycle_time_s;
  let h = S.stale ? `<div class="warn">You changed the route or vehicle since this run. Press <b>▶ Run simulation</b> again to update.</div>` : "";
  h += `<h3>${esc(s.agv)} · ${esc(s.route)}</h3>`;
  const lfi = s.line_follow;
  if (lfi) {
    if (lfi.aborted) h += `<div class="warn bad"><b>✗ The AGV LOSES THE TAPE</b> - it brakes and waits for an operator. The cycle is not completed (shown up to the stop).</div>`;
    else if (lfi.losses) h += `<div class="warn">⚠ Tape lost ${lfi.losses}× but found again while braking.</div>`;
    else h += `<div class="good">✓ Stays on the tape all the way (your PID, closed loop).</div>`;
  }
  h += `<div class="cards">`;
  if (lfi && lfi.max_abs_mm != null) {
    const r = lfi.max_abs_mm / lfi.range_mm;
    h += card("Tape error (max)", `${fmt(lfi.max_abs_mm, 0)} mm`, `of ±${fmt(lfi.range_mm, 0)} mm sensor range · RMS ${fmt(lfi.rms_mm, 0)} mm`, lfi.aborted ? "red" : lvl(r, 0.6, 0.85));
    h += card("Tape margin left", `${fmt(Math.max(0, lfi.margin_mm), 0)} mm`, `worst at t = ${fmt(lfi.worst.t, 1)} s (orange ring)`, lfi.aborted ? "red" : lvl(r, 0.6, 0.85));
  }
  const tg = s.target_cycle_s;
  h += card("Cycle time", s.cycle_complete === false ? "incomplete" : `${fmt(T, 1)} s`,
            s.cycle_complete === false ? `stopped at ${fmt(T, 1)} s (tape lost)` :
            tg ? `target ${fmt(tg, 1)} s · ${s.target_gap_s > 0.05 ? fmt(s.target_gap_s, 1) + " s too slow" : fmt(-s.target_gap_s, 1) + " s to spare"}` : `${fmt(T / 60, 2)} min per round`,
            s.cycle_complete === false ? "red" : tg ? (s.target_gap_s > 0.05 ? "red" : "ok") : "");
  h += card("Throughput", `${fmt(s.cycles_per_hour, 1)} /h`, "cycles per hour");
  h += card("Path length", `${fmt(s.path_length_m, 1)} m`, `axle drove ${fmt(s.distance_axle_m, 1)} m`);
  h += card("Average speed", `${fmt(s.avg_speed_driving, 2)} m/s`, `while driving · ${fmt(s.avg_speed_overall, 2)} m/s incl. stops · max ${fmt(s.max_speed, 2)}`);
  const lp = s.laps || [];
  if (lp.length && lp[0].closed) {
    const L1 = lp[0];
    h += card(lp.length > 1 ? "Loop 1 average speed" : "Loop average speed", `${fmt(L1.avg_speed, 2)} m/s`,
              `${fmt(L1.distance_m, 1)} m in ${fmt(L1.time_s, 1)} s · ${fmt(L1.avg_speed_driving, 2)} m/s while driving`);
  }
  if (s.train && S.agv.hook.type === "tow") h += card("Trolleys", `${s.train.count} × · ${fmt(s.train.total_kg, 0)} kg`,
      s.train.masses_kg.map(m => fmt(m, 0)).join(" + ") + " kg" + (s.articulation_joints_deg && s.articulation_joints_deg.length > 1 ? ` · max angle ${s.articulation_joints_deg.map(a => fmt(a, 0) + "°").join(" / ")}` : ""));
  if (s.trolley_push) { const P = s.trolley_push; h += card("Trolley push (max)", `${fmt(P.max_n, 0)} N`,
      `trolleys pushing the AGV while it slows / brakes · ${fmt(P.over_s, 1)} s above ${fmt(P.allow_n, 0)} N`, P.over_s > 1 ? "amber" : "ok"); }
  h += card("Tightest turn", `${fmt(s.min_turn_radius_axle_m, 2)} m`, `radius of the drive axle`);
  h += card("Clear circle to turn on the spot", `${fmt(s.pivot_swept_radius_m * 2, 2)} m`, `diameter (radius ${fmt(s.pivot_swept_radius_m, 2)} m)`);
  if (s.articulation_max_deg != null) h += card("Max cart angle", `${fmt(s.articulation_max_deg, 0)}°`, `limit ${S.agv.cart.max_articulation_deg}°`,
                                              lvl(s.articulation_max_deg / S.agv.cart.max_articulation_deg, 0.85, 1));
  h += card("Motor torque (peak)", `${fmt(100 * m.peak_torque_nm / m.peak_torque_allowed_nm, 0)} %`, `${fmt(m.peak_torque_nm, 2)} of ${fmt(m.peak_torque_allowed_nm, 2)} N·m`,
            lvl(m.peak_torque_nm / m.peak_torque_allowed_nm, 0.8, 1));
  h += card("Motor heat load", `${fmt(100 * m.rms_torque_nm / m.rated_torque_nm, 0)} %`, `RMS vs rated torque`, lvl(m.rms_torque_nm / m.rated_torque_nm, 0.8, 1));
  h += card("Motor speed", `${fmt(m.peak_rpm, 0)} rpm`, `max ${fmt(m.max_rpm_allowed, 0)} rpm`, lvl(m.peak_rpm / m.max_rpm_allowed, 0.95, 1.001));
  h += card("Tyre grip used", `${fmt(100 * s.traction_usage_max, 0)} %`, "100 % = wheels slip", lvl(s.traction_usage_max, 0.6, 0.9));
  const tsa = s.tip_safety_agv, tsc = s.tip_safety_cart;
  const tmin = Math.min(tsa ?? Infinity, tsc ?? Infinity);
  h += card("Tip-over safety", isFinite(tmin) ? `${fmt(tmin, 1)} ×` : "–", `AGV ${fmt(tsa, 1)}×` + (s.tip_safety_cart !== undefined ? ` · cart ${fmt(tsc, 1)}×` : "") + " (1 = tips)",
            !isFinite(tmin) ? "ok" : tmin < 1 ? "red" : tmin < 2 ? "amber" : "ok");
  h += card("Speed ramps", s.jerk ? "S-curve" : "linear", (s.jerk ? `jerk ${fmt(s.jerk, 2)} m/s³ · ` : "") + "modes: " + esc((s.modes_used || []).join(", ")));
  h += card("Energy", `${fmt(e.wh_per_cycle, 2)} Wh`, `per cycle, avg ${fmt(e.avg_power_w, 0)} W`);
  h += card("Battery", `${fmt(e.runtime_h, 1)} h`, `${fmt(e.cycles_per_charge, 0)} cycles per charge`);
  const nc = (s.collisions || []).length, nm = (s.clearance_violations || []).length;
  h += card("Collisions", nc ? nc : "none", nm ? `${nm} spot(s) under the ${fmt(S.agv.simulation.safety_margin * 100, 0)} cm margin` : "safety margin OK", nc ? "red" : nm ? "amber" : "ok");
  h += `</div>`;
  if (lp.length && lp[0].closed) {
    h += `<h3>Loops (start point → back to the start point)</h3><table><tr><th>Loop</th><th>From</th><th>Time</th><th>Distance</th><th>Avg speed</th><th>Avg driving</th><th>Stops</th></tr>` +
      lp.map(r => `<tr class="click" onclick="seek(${r.t0})"><td>${r.lap}</td><td>${fmt(r.t0, 0)} s</td><td>${fmt(r.time_s, 1)} s</td><td>${fmt(r.distance_m, 1)} m</td>
        <td><b>${fmt(r.avg_speed, 3)}</b> m/s</td><td>${fmt(r.avg_speed_driving, 3)} m/s</td><td>${r.stops}</td></tr>`).join("") +
      `</table><div class="hint">A loop runs from leaving the start point until leaving it again, so it includes one wait at the start point. Avg speed = distance ÷ loop time (with stops); Avg driving = distance ÷ time on the move.</div>`;
  }
  if (s.speed_by_mode && s.speed_by_mode.length) {
    const hasLoad = s.speed_by_mode.some(r => r.load);
    h += `<h3>Speed per speed mode</h3><table><tr><th>Mode</th>${hasLoad ? "<th>Trolleys</th>" : ""}<th>Set</th><th>Average</th><th>Max</th><th>Time</th><th>Distance</th></tr>` +
      s.speed_by_mode.map(r => `<tr><td>${esc(r.mode)}</td>${hasLoad ? `<td>${r.load === "loaded" ? "pulling" : r.load === "empty" ? "none" : "–"}</td>` : ""}<td>${r.target == null ? "–" : fmt(r.target, 2)}</td><td><b>${fmt(r.avg, 2)}</b></td><td>${fmt(r.max, 2)}</td>
        <td>${fmt(r.time_s, 0)} s</td><td>${fmt(r.distance_m, 1)} m</td></tr>`).join("") +
      `</table><div class="hint">m/s, measured on the simulated AGV while that speed_mode was active (includes the ramps after the tag and the PID's speed reduction). Max can be above "Set" while it is still slowing down after a tag.</div>`;
  }
  if (s.load_table && s.load_table.length > 1) {
    const cur = s.train ? s.train.count : 1;
    const inf = v => isFinite(v) ? v : Infinity;
    h += `<h3>With and without trolleys (flat floor)</h3><table><tr><th></th><th>Load</th><th>Speed up</th><th>0→${fmt(s.load_table[0].v_top, 2)}</th><th>Past stop tag</th><th>Max slope</th></tr>` +
      s.load_table.map(r => `<tr ${r.trolleys === cur && S.agv.hook.type === "tow" ? 'style="font-weight:600"' : ""}><td style="text-align:left">${esc(r.label)}</td><td>${fmt(r.load_kg, 0)} kg</td>
        <td class="${r.accel < 0.5 * r.accel_asked ? "amber" : ""}">${fmt(r.accel, 2)}${r.limit !== "controller ramp" ? ` <span class="muted">${esc(r.limit)}</span>` : ""}</td>
        <td title="${isFinite(inf(r.d_to_top)) ? fmt(r.d_to_top, 2) + ' m' : ''}">${isFinite(inf(r.t_to_top)) ? fmt(r.t_to_top, 1) + " s" : "cannot"}</td>
        <td title="brake ${fmt(r.brake, 2)} m/s²">${isFinite(inf(r.brake_dist)) ? fmt(100 * r.brake_dist, 0) + " cm" : "cannot stop"}</td>
        <td class="${r.max_slope_pct < 3 ? "amber" : ""}">${fmt(r.max_slope_pct, 1)} %</td></tr>`).join("") +
      `</table><div class="hint">The simulation drives with this: the drive wheels only carry the AGV (${fmt(s.load_table[0].drive_force, 0)} N of grip / motor force), the trolleys add mass and rolling drag and have no brakes. Speed up in m/s² (the controller asks ${fmt(s.load_table[0].accel_asked, 2)}); 0→ = seconds to top speed; past stop tag = how far the AGV rolls past the stop tag. More weight on the drive wheels, a higher tyre friction or lighter trolleys help.</div>`;
  }
  const sh = [["drive", s.drive_time_s, "#1f6feb"], ["turn on spot", s.pivot_time_s, "#7048e8"], ["waiting", s.dwell_time_s, "#868e96"]];
  h += `<h3>Where the time goes</h3><div class="bar">${sh.filter(x => x[1] > 0).map(x => `<div style="width:${100 * x[1] / T}%;background:${x[2]}">${x[0]} ${fmt(x[1], 0)} s</div>`).join("")}</div>`;
  if (s.warnings.length) h += `<h3>Warnings</h3>` + s.warnings.map(w => /^Note:/.test(w) ? `<div class="hint" style="background:#f1f5ff;border:1px solid #c5d5ff;border-radius:6px;padding:7px 10px">ℹ ${esc(w.slice(6))}</div>`
      : `<div class="warn ${/COLLISION|DOES NOT FIT|TIPS OVER|TRACK LOST|jackknife/.test(w) ? "bad" : ""}">⚠ ${esc(w)}</div>`).join("");
  else h += `<div class="good">✓ No warnings.</div>`;
  if (s.uncalibrated && s.uncalibrated.length) h += `<details style="margin-top:8px"><summary>Uncalibrated inputs (${s.uncalibrated.length} value(s) marked TODO)</summary><div class="inner">
      <div class="hint">These are placeholders in the vehicle file - the results depend on them. Measure them for trustworthy numbers.</div>
      ${s.uncalibrated.map(u => `<div class="hint" style="margin:2px 0">? ${esc(u)}</div>`).join("")}</div></details>`;

  h += `<h3>Timeline</h3><table><tr><th>Step</th><th>From</th><th>Time</th><th>Distance</th><th>Avg speed</th></tr>` +
       s.events.map(ev => `<tr class="click" onclick="seek(${ev.t0})"><td style="white-space:normal;text-align:left">${esc(ev.label)}${ev.mode && ev.mode !== "default" ? ` <span class="muted">[${esc(ev.mode)}]</span>` : ""}</td><td>${fmt(ev.t0, 1)} s</td><td>${fmt(ev.duration, 1)} s</td>
       <td>${ev.kind === "drive" ? fmt(ev.distance, 2) + " m" : ev.kind === "pivot" ? fmt(ev.angle_deg, 0) + "°" : ""}</td>
       <td>${ev.kind === "drive" && ev.duration > 0 ? fmt(ev.distance / ev.duration, 2) + " m/s" : ""}</td></tr>`).join("") + `</table>`;
  if (s.arcs.length) {
    h += `<h3>Curves</h3><div class="hint">Radius drawn → what the drive axle and inner wheel really drive, and the floor width the vehicle${S.res.traj.cx ? " + cart" : ""} needs.</div>
      <table><tr><th>Corner</th><th>Drawn R</th><th>Axle R</th><th>Inner wheel</th><th>Outer edge</th><th>Swept width</th><th>Speed</th>${S.res.traj.cx ? "<th>Cart cuts in</th>" : ""}${s.line_follow ? "<th>Tape err</th>" : ""}</tr>` +
      s.arcs.map(a => `<tr><td>${esc(a.label)}</td><td>${fmt(a.path_radius, 2)}</td><td>${fmt(a.axle_radius_min, 2)}</td><td>${fmt(a.inner_wheel_radius, 2)}</td>
      <td>${fmt(a.outer_swept_radius, 2)}</td><td>${fmt(a.swept_width, 2)}</td><td>${fmt(a.speed, 2)}</td>${S.res.traj.cx ? `<td>${fmt(a.trailer_offtrack, 2)}</td>` : ""}${s.line_follow ? `<td>${a.pv_max_mm == null ? "–" : fmt(a.pv_max_mm, 0) + " mm"}</td>` : ""}</tr>`).join("") +
      `</table><div class="hint">All in metres (speed m/s).</div>`;
  }
  if (s.checks && s.checks.length) h += `<h3>Design checks</h3>` + s.checks.map(c => `<div class="hint">• ${esc(c)}</div>`).join("");
  const F = S.res.files;
  h += `<h3>Charts & files</h3><div class="flex"><button onclick="showCharts()">📈 Speed / torque charts</button>
        <a href="/results/${F["report.txt"]}?dl=1"><button>report.txt</button></a>
        <a href="/results/${F["timeseries.csv"]}?dl=1"><button>timeseries.csv</button></a>
        <a href="/results/${F["report.png"]}?dl=1"><button>report.png</button></a></div>
        <div class="hint">Also saved in the <code>results/</code> folder.</div>
        <details><summary>Full text report</summary><div class="inner"><pre>${esc(S.res.report)}</pre></div></details>`;
  el.innerHTML = h;
}

function renderTurning() {
  const el = $("pane-turning"); if (!el) return;
  const o = S.turnOpts, st = S.turn, A = S.agv;
  let h = `<h3>Turning-radius study</h3>
    <div class="hint">Drives one corner with each radius and once by stopping and turning on the spot, using the vehicle
    from the Vehicle tab. Shows the real radius of the drive axle and inner wheel, the floor it sweeps (with the cart),
    the time, and whether motors, grip, cart angle and tip-over stay within limits.</div>
    <div class="row"><label>Corner angle</label><input type="number" min="10" max="179" step="5" value="${o.angle}" onchange="S.turnOpts.angle=+this.value"><span class="unit">°</span></div>
    <div class="row"><label>Radii to test (drawn / tape)</label></div>
    <input type="text" class="wide" value="${esc(o.radii)}" onchange="S.turnOpts.radii=this.value" placeholder="e.g. 0.5 0.75 1 1.5 2 3">
    ${A && A.hook.type !== "none" ? `<label style="display:block;margin-top:6px"><input type="checkbox" ${o.cart ? "checked" : ""} onchange="S.turnOpts.cart=this.checked"> With the ${A.hook.type === "tow" ? "towed" : "carried"} cart</label>` : ""}
    <div class="row"><label>Radius to draw in detail</label><input type="number" min="0" step="0.25" placeholder="auto" value="${o.show}" onchange="S.turnOpts.show=this.value"><span class="unit">m</span></div>
    <button class="primary" id="turnBtn" onclick="runTurning()" style="margin-top:6px">▶ Run turning study</button>`;
  if (st) {
    const mf = st.min_feasible_radius;
    h += `<h3>Result</h3><div class="${mf != null ? "good" : "warn bad"}">${mf != null ? `Smallest radius without problems: <b>${fmt(mf, 2)} m</b>` : "No tested radius works without problems."}
          ${st.with_cart ? " (with cart)" : " (without cart)"}</div>
      <table><tr><th>R</th><th>Axle R</th><th>Inner whl</th><th>Swept</th><th>Time</th><th>Grip</th>${st.rows.some(r => r.tape_err_mm != null) ? "<th>Tape</th>" : ""}<th>Status</th></tr>` +
      st.rows.map(r => r.status === "error" ? `<tr><td>${fmt(r.R, 2)}</td><td colspan="6" style="text-align:left">error</td></tr>` :
        `<tr title="${esc((r.notes || []).join("; "))}"><td>${r.R === 0 ? "pivot" : fmt(r.R, 2)}</td><td>${fmt(r.R_axle, 2)}</td><td>${fmt(r.R_inner_wheel, 2)}</td>
         <td>${r.R === 0 ? "⌀ " + fmt(2 * r.env_outer, 2) : fmt(r.env_inner, 2) + "–" + fmt(r.env_outer, 2)}</td><td>${fmt(r.time_s, 1)} s</td><td>${fmt(r.grip_pct, 0)} %</td>${st.rows.some(r => r.tape_err_mm != null) ? `<td>${fmt(r.tape_err_mm, 0)} mm</td>` : ""}
         <td style="text-align:left;white-space:normal;color:${/FAIL/.test(r.status) ? "#c92a2a" : r.status === "marginal" ? "#e8890c" : "#2b8a3e"}">${esc(r.status)}</td></tr>`).join("") +
      `</table><div class="hint">m and s. Swept = inner–outer edge of the floor used in the corner, measured from the curve centre (pivot: diameter of the circle).
       Time = whole manoeuvre between the same start and end points. Hover a row for notes.</div>
      <div class="flex"><button onclick="openModal('<img src=\'data:image/png;base64,'+S.turn.png+'\'>')">🔍 Full-size chart</button>
      <a href="/results/${st.files["turning.txt"]}?dl=1"><button>turning.txt</button></a>
      <a href="/results/${st.files["turning.png"]}?dl=1"><button>turning.png</button></a></div>
      <details><summary>Full table</summary><div class="inner"><pre>${esc(st.text)}</pre></div></details>`;
  }
  el.innerHTML = h;
}
async function runTurning() {
  if (!S.agv) return;
  const o = S.turnOpts, btn = $("turnBtn");
  const radii = String(o.radii).split(/[\s,;]+/).map(Number).filter(x => x > 0);
  btn.disabled = true; btn.textContent = "Running…";
  try {
    const j = await post("/api/turning", {agv: S.agv, radii, angle: +o.angle || 90, with_cart: !!o.cart, show: o.show === "" ? null : +o.show});
    S.turn = j; S.turnImg = null;
    const im = new Image(); im.onload = () => { S.turnImg = im; draw(); }; im.src = "data:image/png;base64," + j.png;
    renderTurning();
  } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = "▶ Run turning study"; }
}
function drawTurning(W, H) {
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  if (!S.turnImg) {
    ctx.fillStyle = "#6b7682"; ctx.font = "15px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(S.turn ? "Loading chart…" : "Set the radii on the left and press ▶ Run turning study", W / 2, H / 2); return;
  }
  const im = S.turnImg, k = Math.min(W / im.naturalWidth, H / im.naturalHeight);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(im, (W - im.naturalWidth * k) / 2, (H - im.naturalHeight * k) / 2, im.naturalWidth * k, im.naturalHeight * k);
}

function showCharts() { openModal(`<img src="data:image/png;base64,${S.res.chart_png}">`); }
function openModal(html) { $("modalBody").innerHTML = html; $("modal").style.display = "flex"; }
function closeModal() { $("modal").style.display = "none"; }

// ---------------------------------------------------------------- playback
function sample(t) {
  const T = S.res.traj, n = T.t.length, dt = n > 1 ? T.t[1] - T.t[0] : 1;
  const f = Math.max(0, Math.min(n - 1, t / dt)), i = Math.min(n - 2, Math.floor(f)), u = n > 1 ? f - i : 0;
  const ok = k => T[k] && T[k][i] != null && T[k][i + 1] != null;
  const L = k => { if (!T[k] || T[k][i] == null) return null; return ok(k) ? T[k][i] + (T[k][i + 1] - T[k][i]) * u : T[k][i]; };
  const A = k => { if (!T[k] || T[k][i] == null) return null; if (!ok(k)) return T[k][i]; let d = T[k][i + 1] - T[k][i]; d = Math.atan2(Math.sin(d), Math.cos(d)); return T[k][i] + d * u; };
  return {x: L("x"), y: L("y"), th: A("th"), v: L("v"), cx: L("cx"), cy: L("cy"), cth: A("cth"), hx: L("hx"), hy: L("hy"),
          art: L("art"), tq: L("tq"), grip: L("grip"), pv: T.pv ? T.pv[Math.round(f)] : null, mode: T.mode[Math.round(f)]};
}
function tf(pts, x, y, th) {
  const c = Math.cos(th), s = Math.sin(th), out = [];
  for (let k = 0; k < pts.length; k += 2) out.push(w2s(x + c * pts[k] - s * pts[k + 1], y + s * pts[k] + c * pts[k + 1]));
  return out;
}
function poly(pts, fill, dash) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.closePath();
  ctx.setLineDash(dash ? [5, 4] : []);
  if (fill && fill !== "none") { ctx.fillStyle = fill; ctx.fill(); }
  ctx.strokeStyle = "#212529"; ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]);
}
function drawVehicleAt(t) {
  const q = sample(t), R = S.res;
  for (const pk of R.parked || []) if (t >= pk.t0 && t <= pk.t1 && R.cart_poly) poly(tf(R.cart_poly, pk.x, pk.y, pk.th), "rgba(81,207,102,.18)", true);
  const tow = R.cart_type === "tow";
  if (q.cx != null && R.cart_poly && tow) {
    if (q.hx != null) { const [a, b] = w2s(q.hx, q.hy), [c, d] = w2s(q.cx, q.cy); ctx.strokeStyle = "#495057"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); }
    poly(tf(R.cart_poly, q.cx, q.cy, q.cth), "rgba(81,207,102,.55)");
  }
  if (tow && R.traj.tr && q.cx != null) {
    let px = q.cx, py = q.cy, pth = q.cth;
    const T = R.traj, n = T.t.length, dt = n > 1 ? T.t[1] - T.t[0] : 1, i = Math.max(0, Math.min(n - 1, Math.round(t / dt)));
    for (const tr of T.tr) {
      if (tr.x[i] == null) break;
      const kx = px - T.coupling * Math.cos(pth), ky = py - T.coupling * Math.sin(pth);
      const [a, b] = w2s(kx, ky), [c, d] = w2s(tr.x[i], tr.y[i]);
      ctx.strokeStyle = "#495057"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke();
      poly(tf(R.cart_poly, tr.x[i], tr.y[i], tr.th[i]), "rgba(81,207,102,.55)");
      px = tr.x[i]; py = tr.y[i]; pth = tr.th[i];
    }
  }
  for (const sh of R.shapes) poly(tf(sh.pts, q.x, q.y, q.th), sh.fill === "none" ? "rgba(81,207,102,.25)" : sh.fill, sh.fill === "none");
  if (q.cx != null && R.cart_poly && !tow) poly(tf(R.cart_poly, q.cx, q.cy, q.cth), "rgba(81,207,102,.35)", true);
  for (const sn of R.sensors) { const [sx, sy] = tf([sn.x, sn.y], q.x, q.y, q.th)[0]; ctx.fillStyle = "#7048e8"; ctx.beginPath(); ctx.arc(sx, sy, 3, 0, 7); ctx.fill(); }
  const mode = ["waiting", "driving", "turning on spot"][q.mode] || "";
  $("plLbl").textContent = (S.seqPlay ? `${seqStepLabel()} · ${fmt(S.seqPlay.t, 0)} / ${fmt(S.seqPlay.total, 0)} s · ` : `${fmt(t, 1)} / ${fmt(R.summary.cycle_time_s, 1)} s · `) + `${mode} · ${fmt(Math.abs(q.v), 2)} m/s` +
                           ` · torque ${fmt(100 * q.tq / R.rated_torque, 0)} %` + (q.grip != null ? ` · grip ${fmt(100 * q.grip, 0)} %` : "") +
                           (q.art != null ? ` · cart ${fmt(q.art, 0)}°` : "") +
                           (R.traj.pv ? (q.pv != null ? ` · tape ${q.pv > 0 ? "+" : ""}${fmt(q.pv, 0)} mm` : (q.mode === 1 ? " · NO TAPE" : "")) : "");
  if ($("plFollow").checked && S.play.on) {
    const [sx, sy] = w2s(q.x, q.y), W = cv.clientWidth, H = cv.clientHeight;
    if (sx < W * 0.25 || sx > W * 0.75 || sy < H * 0.25 || sy > H * 0.7) { S.view.ox += W / 2 - sx; S.view.oy += (H - 60) / 2 - sy; }
  }
}
// playback clock: one run, or a whole sequence (S.seqPlay: global time, the step is switched in)
function pT() { return S.seqPlay ? S.seqPlay.t : S.play.t; }
function pTotal() { return S.seqPlay ? S.seqPlay.total : S.res.summary.cycle_time_s; }
function pSet(t) { if (S.seqPlay) seqApply(t); else S.play.t = t; }
function togglePlay(force) {
  if (!S.res || S.stale) return;
  S.play.on = force === undefined ? !S.play.on : force;
  if (S.play.on && pT() >= pTotal() - 0.05) pSet(0);
  $("playBtn").textContent = S.play.on ? "❚❚" : "▶"; S.play.last = performance.now();
  if (S.play.on) requestAnimationFrame(tick);
}
function tick(now) {
  if (!S.play.on || !S.res || S.stale) return;
  const T = pTotal();
  let t = pT() + (now - S.play.last) / 1000 * +$("plSpeed").value; S.play.last = now;
  if (t >= T) { t = T; pSet(t); togglePlay(false); } else pSet(t);
  $("scrub").value = pT(); draw();
  if (S.play.on) requestAnimationFrame(tick);
}
function seek(t) { if (!S.res || S.stale) return; pSet(t); $("scrub").value = pT(); draw(); }
$("scrub").addEventListener("input", e => { S.play.on = false; $("playBtn").textContent = "▶"; seek(+e.target.value); });
$("plSwept").addEventListener("change", draw);

// =====================================================================================
function showHelp() {
  openModal(`<h2 style="margin-top:0">How to use the AGV Simulator</h2>
  <ol style="line-height:1.7;max-width:640px">

   <li>Click on the plan to place route points. Select a point to name it, make it a <b>stop</b> (with wait time),
       a <b>sharp corner</b> (turn on the spot), give it its own corner radius, or make the next stretch <b>reverse</b>.
       The blue line is the path the vehicle will follow.</li>
   <li><b>Vehicle tab</b> - check the dimensions, wheels, motors, speeds, sensors and hook. The drawing updates live.
       For a magnetic-tape AGV set <i>Path following</i> to the tape sensor.</li>
   <li>Press <b>▶ Run simulation</b>. The <b>Results</b> tab shows cycle time, turning radii, motor load, battery and
       collisions; the map plays the cycle (space bar = play/pause).</li>
   <li>Change any value and run again to compare. <b>Save</b> keeps the route/vehicle for next time.</li>
   <li><b>Speed modes</b> (Vehicle tab) work like your controller's SLOW / EXTRA_SLOW modes; pick one per route point.
       Route points can also have a floor slope and can hitch/unhitch (or lift/lower) a cart.</li>
   <li><b>Line following (your PID)</b> (Vehicle tab): the drive is simulated with your real tape-following
       controller and an MGS1600 model. The Results tab then shows whether the AGV stays on the tape, the largest
       tape error and where it happens, and marks <b>TAPE LOST</b> on the map.</li>
   <li><b>Turning tab</b> - compares corner radii and turning on the spot: real axle radius, swept floor, time, loads,
       cart angle and tip-over.</li>
  </ol>
  <p class="muted">Tip: results are only as good as the numbers - time one real cycle with a stopwatch and tune
  acceleration, braking and curve speed until the simulated time matches.</p>`);
}

resize();
init().catch(e => { status("Error"); toast(e.message, true); });
</script>
